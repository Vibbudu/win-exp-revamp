[workspace]
resolver = "3"
members = [
    "crates/ipc-types",
    "crates/fs-core",
    "crates/shell-interop",
    "crates/indexer",
    "crates/preview",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hyperion-explorer/hyperion-explorer"
authors = ["Hyperion Explorer contributors"]

[workspace.dependencies]
ipc-types = { path = "crates/ipc-types" }
fs-core = { path = "crates/fs-core" }
shell-interop = { path = "crates/shell-interop" }
indexer = { path = "crates/indexer" }
preview = { path = "crates/preview" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
rayon = "1.10"
memchr = "2.7"
crossbeam-channel = "0.5"
log = "0.4"
calamine = "0.38"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
png = "0.18"
notify = "8"
lru = "0.16"
urlencoding = "2"

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_WNet",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep dependencies optimized in debug builds so indexing/search stay fast while developing.
[profile.dev.package."*"]
opt-level = 2
